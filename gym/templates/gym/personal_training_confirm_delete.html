{% extends 'gym/base.html' %}

{% block content %}
<div class="container my-5">
    <h2>Удалить занятие?</h2>
    <p>{{ session.client }} — {{ session.trainer }}, {{ session.date|date:"d/m/Y" }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'personal_training_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
