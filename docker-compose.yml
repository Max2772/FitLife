services:
  db:
    image: postgres:16-alpine
    container_name: fitlife_postgres
    environment:
      POSTGRES_DB: fitlife
      POSTGRES_USER: fitlife
      POSTGRES_PASSWORD: fitlife
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitlife -d fitlife"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    container_name: fitlife_gym
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./media:/app/media
      - ./logs:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=LB5.settings
      - DEBUG=1
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=fitlife
      - POSTGRES_USER=fitlife
      - POSTGRES_PASSWORD=fitlife
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    restart: unless-stopped

volumes:
  postgres_data:
